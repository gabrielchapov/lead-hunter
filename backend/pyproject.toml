[project]
name = "leads-finder-backend"
version = "0.1.0"
description = "FastAPI backend for Brazilian SMB Lead Finder MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "geopy>=2.4.0",
]

[project.scripts]
uvicorn = "uvicorn:main"
